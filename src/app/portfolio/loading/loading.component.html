<div class="editorial-preloader" [class.active]="isLoading" [class.dismissing]="isDismissing" [class.completed]="isCompleted" aria-label="Loading portfolio">
  
  <!-- Sliding Luxury Curtain Layer -->
  <div class="curtain-panel">

    <!-- Top Identity Header -->
    <header class="preloader-header mono">
      <div class="brand-col">
        <span class="brand-dot"></span>
        <span class="brand-name">PAGALAVAN M.</span>
      </div>
      <div class="edition-col">PORTFOLIO // 2024–2025</div>
      <div class="location-col">TAMIL NADU, IN [13°N 80°E]</div>
    </header>

    <!-- Center Stage: Monogram & Haute Counter -->
    <main class="preloader-stage">
      
      <!-- Ambient Studio Glow -->
      <div class="studio-glow" aria-hidden="true"></div>

      <!-- Hairline Monogram Badge with Animated SVG Progress Arc -->
      <div class="monogram-badge">
        <svg class="progress-arc-svg" viewBox="0 0 160 160">
          <circle 
            class="arc-track" 
            cx="80" cy="80" r="70" 
            fill="none" 
            stroke="rgba(255, 255, 255, 0.08)" 
            stroke-width="1.5" />
          <circle 
            class="arc-fill" 
            cx="80" cy="80" r="70" 
            fill="none" 
            stroke="var(--accent-primary, #00e599)" 
            stroke-width="2"
            stroke-dasharray="440"
            [style.strokeDashoffset]="440 - (440 * progress / 100)" />
        </svg>

        <div class="monogram-letter">P</div>
      </div>

      <!-- Giant Editorial Display Counter -->
      <div class="counter-display">
        <span class="counter-num">{{ progress }}</span>
        <span class="counter-symbol">%</span>
      </div>

      <!-- Status Narrative -->
      <div class="phrase-indicator mono">
        <span class="phrase-step">0{{ phraseIndex }} // 04</span>
        <span class="phrase-divider">—</span>
        <span class="phrase-text">{{ currentPhrase }}</span>
      </div>

    </main>

    <!-- Bottom Metadata & Hairline Rail -->
    <footer class="preloader-footer mono">
      <div class="footer-role">ANGULAR &amp; MOBILE APP DEVELOPER</div>
      
      <!-- Ultra-fine Hairline Rail -->
      <div class="hairline-rail" role="progressbar" [attr.aria-valuenow]="progress" aria-valuemin="0" aria-valuemax="100">
        <div class="hairline-fill" [style.width.%]="progress"></div>
      </div>

      <div class="footer-exp">2+ YEARS OF PRODUCTION EXPERIENCE</div>
    </footer>

  </div>

</div>
