<section class="hero" id="home">
  <!-- Particle Canvas Background -->
  <canvas class="particles-canvas" #particlesCanvas></canvas>

  <!-- Gradient Blobs -->
  <div class="hero-blob blob-1"></div>
  <div class="hero-blob blob-2"></div>
  <!-- Grid overlay -->
  <div class="hero-grid"></div>

  <div class="container">
    <div class="hero-content">

      <!-- ── Left: Text ── -->
      <div class="hero-text">

        <div class="available-badge gsap-reveal">
          <span class="pulse-dot"></span>
          Available for new opportunities
        </div>

        <div class="greeting gsap-reveal">Hello, I'm</div>

        <h1 class="hero-title gsap-reveal">
          <span class="name gradient-text">Pagalavan</span>
        </h1>

        <h2 class="hero-subtitle gsap-reveal">
          <span class="typed-text"></span><span class="cursor-typed">|</span>
        </h2>

        <p class="hero-description gsap-reveal">
          A passionate MEAN Stack Developer crafting high-performance, 
          pixel-perfect web applications with Angular, Node.js, and modern APIs.
          Based in Tamil Nadu, India 🇮🇳
        </p>

        <div class="hero-actions gsap-reveal">
          <a class="btn btn-primary magnetic-btn" (click)="scrollToSection('project')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            View My Work
          </a>
          <a class="btn btn-secondary magnetic-btn" (click)="scrollToSection('footer')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16v16H4z"/><polyline points="4,4 12,13 20,4"/>
            </svg>
            Get In Touch
          </a>
        </div>

        <div class="hero-socials gsap-reveal">
          <a href="http://www.linkedin.com/in/pagalavanM" target="_blank" rel="noopener" class="social-icon-btn" aria-label="LinkedIn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
              <rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>
            </svg>
          </a>
          <a href="https://github.com/pagalavan-UI" target="_blank" rel="noopener" class="social-icon-btn" aria-label="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
            </svg>
          </a>
          <a href="mailto:pagalavan25surya@gmail.com" class="social-icon-btn" aria-label="Email">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16v16H4z"/><polyline points="4,4 12,13 20,4"/>
            </svg>
          </a>
        </div>

        <!-- Stats -->
        <div class="hero-stats gsap-reveal">
          <div class="stat glass-card">
            <span class="stat-number" data-target="2">0</span><span class="stat-number">+</span>
            <span class="stat-label">Years Exp.</span>
          </div>
          <div class="stat glass-card">
            <span class="stat-number" data-target="4">0</span><span class="stat-number">+</span>
            <span class="stat-label">Projects</span>
          </div>
          <div class="stat glass-card">
            <span class="stat-number" data-target="10">0</span><span class="stat-number">+</span>
            <span class="stat-label">Technologies</span>
          </div>
        </div>

      </div>

      <!-- ── Right: Image ── -->
      <div class="hero-image gsap-reveal">
        <div class="image-container">
          <!-- Rotating rings -->
          <div class="ring ring-outer"></div>
          <div class="ring ring-inner"></div>

          <div class="image-wrapper">
            <img src="/assets/pagalavan.webp" alt="Pagalavan — MEAN Stack Developer" loading="eager"/>
            <div class="image-overlay"></div>
          </div>

          </div>
          <div class="float-icon icon-mongo" title="MongoDB">

              <path d="M17.193 9.555c-1.264-5.58-4.252-7.414-4.573-8.115-.28-.394-.53-.954-.735-1.44-.036.495-.055.685-.523 1.184-.723.566-4.438 3.682-4.74 10.02-.3 7.019 5.9 10.948 6.47 11.267.027.015.053.032.08.045.879-.62 5.905-4.952 4.021-12.961z"/>

      </div>

    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <div class="scroll-mouse">
        <div class="scroll-wheel"></div>
      </div>
      <span>Scroll</span>
    </div>
  </div>
</section>
