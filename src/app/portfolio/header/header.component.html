<!-- Persistent Scroll-Driven Evolving Canvas -->
<app-evolving-canvas></app-evolving-canvas>

<!-- Custom Cursor (Desktop Only) -->
<app-custom-cursor></app-custom-cursor>

<!-- Developer Layout Grid Overlay (Easter Egg: 'G') -->
<app-dev-grid></app-dev-grid>

<!-- Continuous Signature Thread Motif -->
<div class="signature-thread" aria-hidden="true">
  <div class="signature-thread-glow" #threadGlow></div>
</div>

<!-- Minimal Sticky Navigation -->
<header class="editorial-nav" [class.scrolled]="isScrolled">
  <div class="container nav-container">
    
    <!-- Brand / Name (Smooth return to top) -->
    <a (click)="scrollToSection('home')" class="nav-brand mono" title="Return to Top">
      <span class="brand-prefix">//</span>
      <span class="brand-text">PAGALAVAN</span>
      <span class="brand-role mono">ENG</span>
    </a>

    <!-- Center Nav Links -->
    <nav class="nav-menu" [class.open]="isMenuOpen">
      <a (click)="scrollToSection('work'); closeMenu()" [class.active]="activeSection === 'work'" class="nav-link mono">
        <span class="nav-num">01</span> WORK
      </a>
      <a (click)="scrollToSection('experience'); closeMenu()" [class.active]="activeSection === 'experience'" class="nav-link mono">
        <span class="nav-num">02</span> EXPERIENCE
      </a>
      <a (click)="scrollToSection('frontend'); closeMenu()" [class.active]="activeSection === 'frontend'" class="nav-link mono">
        <span class="nav-num">03</span> FRONTEND
      </a>
      <a (click)="scrollToSection('mobile'); closeMenu()" [class.active]="activeSection === 'mobile'" class="nav-link mono">
        <span class="nav-num">04</span> MOBILE
      </a>
      <a (click)="scrollToSection('stack'); closeMenu()" [class.active]="activeSection === 'stack'" class="nav-link mono">
        <span class="nav-num">05</span> STACK
      </a>
      <a (click)="scrollToSection('about'); closeMenu()" [class.active]="activeSection === 'about'" class="nav-link mono">
        <span class="nav-num">06</span> ABOUT
      </a>

      <!-- Mobile Extras -->
      <div class="mobile-cv-wrapper">
        <app-theme-toggle></app-theme-toggle>
        <button (click)="handleCVDownload($event); closeMenu()" class="btn btn-primary btn-sm">
          <span>Resume ↗</span>
        </button>
      </div>
    </nav>

    <!-- Right Side CTA & Theme Switcher -->
    <div class="nav-right">
      <!-- Theme Switcher -->
      <app-theme-toggle></app-theme-toggle>

      <!-- Resume Button -->
      <button (click)="handleCVDownload($event)" class="btn-cv-nav mono" title="Download Official CV">
        <span>RESUME</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button class="nav-toggle" [class.active]="isMenuOpen" (click)="toggleMenu()" aria-label="Toggle Navigation Menu">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
      </button>
    </div>

  </div>
</header>

<!-- Main Portfolio Sequence -->
<main id="main-content">
  <app-profile id="home"></app-profile>
  <app-project id="work"></app-project>
  <app-experience id="experience"></app-experience>
  <app-skills id="skills"></app-skills>
  <app-about id="about"></app-about>
  <app-achievements id="achievements"></app-achievements>
  <app-contact id="contact"></app-contact>
</main>

<app-footer id="footer"></app-footer>
