<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>
<!-- Minimal Sticky Navigation -->
<header class="editorial-nav" [class.scrolled]="isScrolled">
  <div class="container nav-container">
    <a class="nav-brand" routerLink="/portfolio/header" fragment="home" aria-label="Pagalavan — home"><span class="brand-symbol" aria-hidden="true">p.</span>PAGALAVAN<span class="brand-period">.</span></a>
    <nav id="primary-navigation" class="nav-menu" [class.open]="isMenuOpen" aria-label="Main navigation">
      <a *ngFor="let item of navigation" routerLink="/portfolio/header" [fragment]="item.id" (click)="closeMenu()" [class.active]="activeSection === item.id" [attr.aria-current]="activeSection === item.id ? 'location' : null">{{ item.label }}</a>
      <a routerLink="/portfolio/header" fragment="contact" class="mobile-contact" (click)="closeMenu()">Get in touch <span aria-hidden="true">↗</span></a>
    </nav>
    <div class="nav-right">
      <a class="resume-link" href="assets/Pagalavan_M_Angular_Developer_Resume.pdf" download>Resume <span aria-hidden="true">↗</span></a>
      <button #menuToggle class="nav-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-controls="primary-navigation" [attr.aria-label]="isMenuOpen ? 'Close navigation' : 'Open navigation'"><span>{{ isMenuOpen ? 'Close' : 'Menu' }}</span><span aria-hidden="true">{{ isMenuOpen ? '×' : '+' }}</span></button>
    </div>
  </div>
</header>
<!-- Main Portfolio Sequence -->
<main id="main-content" tabindex="-1">
  <app-profile></app-profile>
  <app-project></app-project>
  <app-frontend></app-frontend>
  <app-experience></app-experience>
  <app-mobile></app-mobile>
  <app-skills></app-skills>
  <app-about></app-about>
  <app-achievements></app-achievements>
  <app-contact></app-contact>
</main>
<app-footer></app-footer>
